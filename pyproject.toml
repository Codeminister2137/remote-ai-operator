[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-ai-operator"
version = "0.1.0"
description = "A standalone, supervised coding agent with evidence-bound approvals"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.10,<3", "starlette>=1.10,<2"]

[project.optional-dependencies]
modal = ["modal>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
remote-ai-operator = "remote_operator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["acceptance"]

[tool.setuptools.package-data]
remote_operator = ["*.html", "*.js", "*.css"]
